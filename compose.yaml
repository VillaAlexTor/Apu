name: apu

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APU_POSTGRES_DB:-apu}
      POSTGRES_USER: ${APU_POSTGRES_USER:-apu}
      POSTGRES_PASSWORD: ${APU_POSTGRES_PASSWORD:-apu_local_only}
    ports:
      - "${APU_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - apu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APU_ENV: local
      APU_HTTP_ADDR: :8080
      APU_DATABASE_URL: postgres://${APU_POSTGRES_USER:-apu}:${APU_POSTGRES_PASSWORD:-apu_local_only}@postgres:5432/${APU_POSTGRES_DB:-apu}?sslmode=disable
    ports:
      - "${APU_BACKEND_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - apu-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APU_DASHBOARD_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - apu-network

volumes:
  postgres-data:

networks:
  apu-network:
    driver: bridge
