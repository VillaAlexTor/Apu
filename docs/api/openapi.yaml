openapi: 3.0.3
info:
  title: APU API
  version: 0.2.0
  description: Contrato versionado de la API de APU.
  license:
    name: Uso privado; todos los derechos reservados
    url: https://github.com/VillaAlexTor/apu
servers:
  - url: https://api.example.invalid/api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          headers:
            Set-Cookie:
              description: Cookie opaca de sesión HttpOnly.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Demasiados intentos de acceso
  /auth/me:
    get:
      operationId: getMe
      summary: Obtener identidad y tenants
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Identidad autorizada
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revocar la sesión actual
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Sesión revocada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pairing/code:
    post:
      operationId: createPairingCode
      summary: Crear código temporal
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Código creado
        '403':
          $ref: '#/components/responses/Forbidden'
  /devices:
    get:
      operationId: listDevices
      summary: Listar dispositivos autorizados
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dispositivos
        '401':
          $ref: '#/components/responses/Unauthorized'
  /devices/{deviceId}/locations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: listLocations
      summary: Consultar historial de ubicación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial paginado
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: ingestLocations
      summary: Ingerir un lote de ubicaciones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Lote aceptado
        '409':
          description: Clave de idempotencia reutilizada con otro payload
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: apu_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    InvalidRequest:
      description: Solicitud inválida
    Unauthorized:
      description: Credencial ausente o inválida
    Forbidden:
      description: Recurso no autorizado
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 1024
    Membership:
      type: object
      required: [tenantId, tenantName, role]
      properties:
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        role:
          type: string
          enum: [tenant_owner, tenant_admin, guardian]
    User:
      type: object
      required: [id, email, displayName, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        platformRole:
          type: string
          enum: [platform_admin, support_agent]
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    LoginResponse:
      type: object
      required: [user, redirect, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        redirect:
          type: string
          enum: [/platform, /admin, /familia, /acceso-pendiente]
        csrfToken:
          type: string
