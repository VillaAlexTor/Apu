openapi: 3.0.3
info:
  title: APU API
  version: 0.3.0
  description: Contrato versionado de la API de APU.
  license:
    name: Uso privado; todos los derechos reservados
    url: https://github.com/VillaAlexTor/apu
servers:
  - url: https://api.example.invalid/api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          headers:
            Set-Cookie:
              description: Cookie opaca de sesión HttpOnly.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Demasiados intentos de acceso
  /auth/me:
    get:
      operationId: getMe
      summary: Obtener identidad y tenants
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Identidad autorizada
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revocar la sesión actual
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Sesión revocada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/activate:
    post:
      operationId: activateInvitation
      summary: Aceptar invitación y establecer contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateInvitationRequest'
      responses:
        '200':
          description: Cuenta activada
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /platform/summary:
    get:
      operationId: getPlatformSummary
      summary: Obtener resumen operativo
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Resumen de tenants, usuarios e invitaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      summary: Listar organizaciones
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Organizaciones visibles para plataforma
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlatformTenant
      summary: Crear organización
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Organización creada
        '409':
          description: Identificador ya registrado
  /platform/tenants/{tenantId}/status:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    patch:
      operationId: setPlatformTenantStatus
      summary: Cambiar estado de organización
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Estado actualizado y auditado
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/users:
    get:
      operationId: listPlatformUsers
      summary: Listar usuarios, membresías y sesiones
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usuarios de plataforma
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/invitations:
    post:
      operationId: createPlatformInvitation
      summary: Invitar o asignar usuario
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitación o membresía creada
        '409':
          description: Membresía existente o estado incompatible
  /platform/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: setPlatformUserStatus
      summary: Suspender, reactivar o desactivar usuario
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Estado actualizado; las sesiones se revocan al suspender o desactivar
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/users/{userId}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: revokePlatformUserSessions
      summary: Revocar todas las sesiones activas de un usuario
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Número de sesiones revocadas
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/tenants/{tenantId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: setPlatformMembershipRole
      summary: Cambiar rol de una membresía
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Rol actualizado y auditado
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/audit:
    get:
      operationId: listPlatformAudit
      summary: Consultar auditoría operacional reciente
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Últimos eventos administrativos
        '403':
          $ref: '#/components/responses/Forbidden'
  /pairing/code:
    post:
      operationId: createPairingCode
      summary: Crear código temporal
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Código creado
        '403':
          $ref: '#/components/responses/Forbidden'
  /devices:
    get:
      operationId: listDevices
      summary: Listar dispositivos autorizados
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dispositivos
        '401':
          $ref: '#/components/responses/Unauthorized'
  /devices/{deviceId}/locations:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      operationId: listLocations
      summary: Consultar historial de ubicación
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historial paginado
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: ingestLocations
      summary: Ingerir un lote de ubicaciones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Lote aceptado
        '409':
          description: Clave de idempotencia reutilizada con otro payload
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: apu_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  responses:
    InvalidRequest:
      description: Solicitud inválida
    Unauthorized:
      description: Credencial ausente o inválida
    Forbidden:
      description: Recurso no autorizado
  schemas:
    ActivateInvitationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          maxLength: 80
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [tenantId, email, displayName, role]
      properties:
        tenantId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        role:
          type: string
          enum: [tenant_owner, tenant_admin, guardian]
    StatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, deactivated]
    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [tenant_owner, tenant_admin, guardian]
    PlatformSummary:
      type: object
      required: [tenantsTotal, tenantsActive, usersActive, usersInvited, usersSuspended, pendingInvitations]
      properties:
        tenantsTotal: { type: integer }
        tenantsActive: { type: integer }
        usersActive: { type: integer }
        usersInvited: { type: integer }
        usersSuspended: { type: integer }
        pendingInvitations: { type: integer }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 1024
    Membership:
      type: object
      required: [tenantId, tenantName, role]
      properties:
        tenantId:
          type: string
          format: uuid
        tenantName:
          type: string
        role:
          type: string
          enum: [tenant_owner, tenant_admin, guardian]
    User:
      type: object
      required: [id, email, displayName, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        platformRole:
          type: string
          enum: [platform_admin, support_agent]
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    LoginResponse:
      type: object
      required: [user, redirect, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        redirect:
          type: string
          enum: [/platform, /admin, /familia, /acceso-pendiente]
        csrfToken:
          type: string
